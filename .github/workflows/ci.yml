name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Read-only. CI builds and tests; it never writes to the repository and
    # never publishes, so it has no reason to hold a writable token.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every Node line still receiving security patches, as of this release:
        # 22 (maintenance LTS, EOL April 2027), 24 (maintenance LTS, EOL April
        # 2028) and 26 (active LTS, EOL April 2029).
        #
        # 18 and 20 are gone, and `engines` moved with them. The library's own
        # API floor is lower — AbortController, AbortSignal.reason and Error
        # `cause` are all Node 18 — but a support claim is only honest for
        # versions that are tested and patched, and 22 is the oldest of those.
        node: ['22', '24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint and module layering
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Coverage thresholds
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Consumer packaging smoke (ESM, CJS, TypeScript)
        run: npm run smoke

      - name: Zero runtime dependencies
        # Also asserted by a test; repeated here so a dependency added in a
        # merge cannot slip through on a green test run alone.
        run: |
          deps=$(node -p "JSON.stringify(require('./package.json').dependencies ?? {})")
          peer=$(node -p "JSON.stringify(require('./package.json').peerDependencies ?? {})")
          echo "dependencies: $deps"
          echo "peerDependencies: $peer"
          test "$deps" = "{}" && test "$peer" = "{}"
